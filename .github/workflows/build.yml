name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Build APK with Flutter
        run: |
          if [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="."
          elif [ -f "flutter_export/pubspec.yaml" ]; then
            PROJECT_DIR="flutter_export"
          else
            PROJECT_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          fi

          cd "$PROJECT_DIR"
          
          # إجبار Flutter على حل تعارض المكتبات بناءً على بيئة البناء
          flutter pub add intl:^0.18.1 --no-api-docs || true
          flutter pub get || true
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualPhone-APK
          path: |
            **/build/app/outputs/flutter-apk/*.apk
            **/build/app/outputs/apk/release/*.apk
